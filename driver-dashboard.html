<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIVORA - Driver Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 14px;
  font-family:Arial,sans-serif;
  background:#f3f7ff;
  color:#222;
  text-align:center
}

h1{color:#06f;margin:10px 0 5px}
h2{margin:5px 0 20px}

.card{
  max-width:460px;
  margin:18px auto;
  padding:22px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 3px 15px rgba(0,0,0,.10)
}

input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px
}

button{
  padding:12px 18px;
  margin:5px;
  border:0;
  border-radius:8px;
  font-size:15px;
  cursor:pointer
}

.login{background:#06f;color:#fff}
.available{background:#16a34a;color:#fff}
.busy{background:#dc2626;color:#fff}
.offline{background:#333;color:#fff}
.accept{background:#16a34a;color:#fff}
.reject{background:#dc2626;color:#fff}
.location{background:#06f;color:#fff}
.stop{background:#333;color:#fff}
.logout{background:#555;color:#fff}

#dashboard{display:none}

.info{font-size:17px;margin:10px 0}

.status{
  font-size:18px;
  font-weight:bold
}

#locationText{
  word-break:break-word
}

.booking{
  text-align:left;
  padding:15px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
  background:#f8fafc
}

.booking-buttons{
  text-align:center;
  margin-top:12px
}

.empty{
  color:#666;
}
</style>
</head>

<body>

<h1>🚗 DRIVORA</h1>
<h2>Driver Dashboard</h2>

<div id="loginBox" class="card">

<h3>🔐 Driver Login</h3>

<input id="driverName" type="text" placeholder="Driver Name">

<input id="driverPhone" type="tel" placeholder="Phone Number">

<input id="vehicle" type="text" placeholder="Vehicle Number">

<button class="login" id="loginBtn">
🚗 Login
</button>

</div>

<div id="dashboard">

<div class="card">

<h3>👤 Driver Information</h3>

<p class="info">
Driver: <b id="showName">-</b>
</p>

<p class="info">
Phone: <b id="showPhone">-</b>
</p>

<p class="info">
Vehicle: <b id="showVehicle">-</b>
</p>

</div>

<div class="card">

<h3>🚦 Driver Status</h3>

<button class="available" id="availableBtn">
🟢 Available
</button>

<button class="busy" id="busyBtn">
🔴 Busy
</button>

<button class="offline" id="offlineBtn">
⚫ Offline
</button>

<p class="status">
Current Status:
<span id="status">Offline</span>
</p>

</div>

<div class="card">

<h3>📍 Live Driver Location</h3>

<p id="locationText">
Location sharing is OFF
</p>

<button class="location" id="locationBtn">
📍 Share My Location
</button>

<button class="stop" id="stopLocationBtn">
🛑 Stop Sharing
</button>

</div>

<div class="card">

<h3>📋 My Bookings</h3>

<div id="bookingList">

<p class="empty">
Checking for bookings...
</p>

</div>

</div>

<button class="logout" id="logoutBtn">
🚪 Logout
</button>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  update
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyDmW5pUrfGFoAhlhc0-BGqmw3S-se_Lsxw",

  authDomain: "drivora-35eed.firebaseapp.com",

  databaseURL:
  "https://drivora-35eed-default-rtdb.firebaseio.com",

  projectId: "drivora-35eed",

  storageBucket:
  "drivora-35eed.firebasestorage.app",

  messagingSenderId: "691701212381",

  appId:
  "1:691701212381:web:44fc679b1309cc7f31a734"

};


const app = initializeApp(firebaseConfig);

const database = getDatabase(app);


function loginDriver(){

  const name =
  document.getElementById("driverName").value.trim();

  const phone =
  document.getElementById("driverPhone").value.trim();

  const vehicle =
  document.getElementById("vehicle").value.trim();


  if(!name || !phone || !vehicle){

    alert(
      "Please enter Driver Name, Phone Number and Vehicle Number."
    );

    return;
  }


  localStorage.setItem("driverName", name);

  localStorage.setItem("driverPhone", phone);

  localStorage.setItem("vehicle", vehicle);

  localStorage.setItem("driverStatus", "Available");


  showDashboard();

  alert("Driver Login Successful! 🚗");

}


function showDashboard(){

  const name =
  localStorage.getItem("driverName");

  const phone =
  localStorage.getItem("driverPhone");

  const vehicle =
  localStorage.getItem("vehicle");


  if(!name || !phone || !vehicle){

    document.getElementById("loginBox").style.display =
    "block";

    document.getElementById("dashboard").style.display =
    "none";

    return;
  }


  document.getElementById("loginBox").style.display =
  "none";

  document.getElementById("dashboard").style.display =
  "block";


  document.getElementById("showName").textContent =
  name;

  document.getElementById("showPhone").textContent =
  phone;

  document.getElementById("showVehicle").textContent =
  vehicle;


  const savedStatus =
  localStorage.getItem("driverStatus");


  if(savedStatus){

    document.getElementById("status").textContent =
    savedStatus;

  }


  loadBookings();

}


function setStatus(newStatus){

  document.getElementById("status").textContent =
  newStatus;

  localStorage.setItem(
    "driverStatus",
    newStatus
  );

}


function loadBookings(){

  const bookingList =
  document.getElementById("bookingList");


  const bookingsRef =
  ref(database, "bookings");


  onValue(bookingsRef, (snapshot) => {

    bookingList.innerHTML = "";


    if(!snapshot.exists()){

      bookingList.innerHTML =
      '<p class="empty">No bookings yet.</p>';

      return;

    }


    const bookings =
    snapshot.val();


    Object.entries(bookings).forEach(
      ([bookingId, booking]) => {

        const bookingDiv =
        document.createElement("div");

        bookingDiv.className =
        "booking";


        bookingDiv.innerHTML = `

          <b>🚗 Booking #${bookingId}</b>
          <br><br>

          👤 Customer:
          ${booking.customerName || "-"}
          <br>

          📞 Phone:
          ${booking.phone || "-"}
          <br>

          📍 Pickup:
          ${booking.pickupLocation || "-"}
          <br>

          🏁 Destination:
          ${booking.destination || "-"}
          <br>

          🚦 Status:
          <b>${booking.status || "Pending"}</b>

          <div class="booking-buttons">

            <button
              class="accept"
              data-id="${bookingId}"
              data-action="accept"
            >
              ✅ Accept Booking
            </button>

            <button
              class="reject"
              data-id="${bookingId}"
              data-action="reject"
            >
              ❌ Reject Booking
            </button>

          </div>

        `;


        bookingList.appendChild(bookingDiv);

      }
    );


    document
    .querySelectorAll(".booking button")
    .forEach(button => {

      button.addEventListener("click", () => {

        const id =
        button.dataset.id;

        const action =
        button.dataset.action;


        updateBookingStatus(
          id,
          action
        );

      });

    });

  });

}


async function updateBookingStatus(
  bookingId,
  action
){

  const newStatus =
  action === "accept"
  ? "Accepted"
  : "Rejected";


  try{

    const bookingRef =
    ref(
      database,
      "bookings/" + bookingId
    );


    await update(
      bookingRef,
      {
        status: newStatus
      }
    );


    alert(
      newStatus === "Accepted"
      ? "Booking Accepted! 🚗"
      : "Booking Rejected."
    );


  }catch(error){

    console.error(error);

    alert(
      "Unable to update booking."
    );

  }

}


function shareLocation(){

  if(!navigator.geolocation){

    alert(
      "Location is not supported on this device."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position){

      const latitude =
      position.coords.latitude;

      const longitude =
      position.coords.longitude;


      document.getElementById(
        "locationText"
      ).textContent =
      "📍 Location: " +
      latitude.toFixed(5) +
      ", " +
      longitude.toFixed(5);


      localStorage.setItem(
        "driverLatitude",
        latitude
      );

      localStorage.setItem(
        "driverLongitude",
        longitude
      );

    },

    function(){

      document.getElementById(
        "locationText"
      ).textContent =
      "Location permission denied.";

    }

  );

}


function stopLocation(){

  document.getElementById(
    "locationText"
  ).textContent =
  "Location sharing is OFF";

}


function logout(){

  localStorage.removeItem("driverName");

  localStorage.removeItem("driverPhone");

  localStorage.removeItem("vehicle");

  localStorage.removeItem("driverStatus");

  localStorage.removeItem("driverLatitude");

  localStorage.removeItem("driverLongitude");


  location.reload();

}


document
.getElementById("loginBtn")
.addEventListener(
  "click",
  loginDriver
);


document
.getElementById("availableBtn")
.addEventListener(
  "click",
  () => setStatus("Available")
);


document
.getElementById("busyBtn")
.addEventListener(
  "click",
  () => setStatus("Busy")
);


document
.getElementById("offlineBtn")
.addEventListener(
  "click",
  () => setStatus("Offline")
);


document
.getElementById("locationBtn")
.addEventListener(
  "click",
  shareLocation
);


document
.getElementById("stopLocationBtn")
.addEventListener(
  "click",
  stopLocation
);


document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  logout
);


showDashboard();

</script>

</body>
</html>
