<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRIVORA</title>
</head>

<body style="font-family:Arial,sans-serif;text-align:center;margin-top:50px;background:#f3f7ff;">

  <h1 style="color:#0066ff;">🚗 DRIVORA</h1>
  <h2>Welcome to DRIVORA</h2>
  <p>Your Driver Booking App</p>

  <h3>📋 Book a Driver</h3>

  <input id="name" type="text" placeholder="Customer Name"
    style="display:block;margin:10px auto;padding:12px;width:80%;max-width:350px;">

  <input id="phone" type="tel" placeholder="Phone Number"
    style="display:block;margin:10px auto;padding:12px;width:80%;max-width:350px;">

  <input id="pickup" type="text" placeholder="Pickup Location"
    style="display:block;margin:10px auto;padding:12px;width:80%;max-width:350px;">

  <input id="destination" type="text" placeholder="Destination"
    style="display:block;margin:10px auto;padding:12px;width:80%;max-width:350px;">

  <button id="bookBtn"
    style="margin-top:15px;padding:12px 20px;background:#0066ff;color:white;border:0;border-radius:8px;">
    🚗 Book Driver
  </button>

  <p id="message" style="font-weight:bold;"></p>

  <a href="driver-dashboard.html"
    style="display:inline-block;margin-top:20px;padding:12px 20px;background:#222;color:white;text-decoration:none;border-radius:8px;">
    🚗 Driver Dashboard
  </a>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmW5pUrfGFoAhlhc0-BGqmw3S-se_Lsxw",
      authDomain: "drivora-35eed.firebaseapp.com",
      databaseURL: "https://drivora-35eed-default-rtdb.firebaseio.com",
      projectId: "drivora-35eed",
      storageBucket: "drivora-35eed.firebasestorage.app",
      messagingSenderId: "691701212381",
      appId: "1:691701212381:web:44fc679b1309cc7f31a734"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    document.getElementById("bookBtn").addEventListener("click", async () => {

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const pickup = document.getElementById("pickup").value.trim();
      const destination = document.getElementById("destination").value.trim();
      const message = document.getElementById("message");

      if (!name || !phone || !pickup || !destination) {
        message.textContent = "⚠️ Please fill all details.";
        message.style.color = "red";
        return;
      }

      try {

        const bookingRef = push(ref(database, "bookings"));

        await set(bookingRef, {
          customerName: name,
          phone: phone,
          pickupLocation: pickup,
          destination: destination,
          status: "Pending",
          createdAt: new Date().toISOString()
        });

        message.textContent = "✅ Booking created successfully!";
        message.style.color = "green";

        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("pickup").value = "";
        document.getElementById("destination").value = "";

      } catch (error) {

        console.error(error);
        message.textContent = "❌ Booking failed. Please try again.";
        message.style.color = "red";

      }

    });

  </script>

</body>
</html>
